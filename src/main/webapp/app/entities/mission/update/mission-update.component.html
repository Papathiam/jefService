<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-mission-heading" data-cy="MissionCreateUpdateHeading" jhiTranslate="jefServiceApp.mission.home.createOrEditLabel">
        Créer ou éditer un Mission
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jefServiceApp.mission.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_description" jhiTranslate="jefServiceApp.mission.description">Description</label>
          <input
            type="text"
            class="form-control"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_latitude" jhiTranslate="jefServiceApp.mission.latitude">Latitude</label>
          <input type="number" class="form-control" name="latitude" id="field_latitude" data-cy="latitude" formControlName="latitude" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_longitude" jhiTranslate="jefServiceApp.mission.longitude">Longitude</label>
          <input type="number" class="form-control" name="longitude" id="field_longitude" data-cy="longitude" formControlName="longitude" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_statut" jhiTranslate="jefServiceApp.mission.statut">Statut</label>
          <select class="form-control" name="statut" formControlName="statut" id="field_statut" data-cy="statut">
            <option [ngValue]="null">{{ 'jefServiceApp.StatutMission.null' | translate }}</option>
            @for (statutMission of statutMissionValues; track $index) {
              <option [value]="statutMission">{{ 'jefServiceApp.StatutMission.' + statutMission | translate }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_prixPropose" jhiTranslate="jefServiceApp.mission.prixPropose">Prix Propose</label>
          <input
            type="number"
            class="form-control"
            name="prixPropose"
            id="field_prixPropose"
            data-cy="prixPropose"
            formControlName="prixPropose"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_dateCreation" jhiTranslate="jefServiceApp.mission.dateCreation">Date Creation</label>
          <div class="d-flex">
            <input
              id="field_dateCreation"
              data-cy="dateCreation"
              type="datetime-local"
              class="form-control"
              name="dateCreation"
              formControlName="dateCreation"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_paiement" jhiTranslate="jefServiceApp.mission.paiement">Paiement</label>
          <select
            class="form-control"
            id="field_paiement"
            data-cy="paiement"
            name="paiement"
            formControlName="paiement"
            [compareWith]="comparePaiement"
          >
            <option [ngValue]="null"></option>
            @for (paiementOption of paiementsCollection; track $index) {
              <option [ngValue]="paiementOption">{{ paiementOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_serviceJef" jhiTranslate="jefServiceApp.mission.serviceJef">Service Jef</label>
          <select
            class="form-control"
            id="field_serviceJef"
            data-cy="serviceJef"
            name="serviceJef"
            formControlName="serviceJef"
            [compareWith]="compareServiceJef"
          >
            <option [ngValue]="null"></option>
            @for (serviceJefOption of serviceJefsSharedCollection; track $index) {
              <option [ngValue]="serviceJefOption">{{ serviceJefOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_client" jhiTranslate="jefServiceApp.mission.client">Client</label>
          <select
            class="form-control"
            id="field_client"
            data-cy="client"
            name="client"
            formControlName="client"
            [compareWith]="compareClient"
          >
            <option [ngValue]="null"></option>
            @for (clientOption of clientsSharedCollection; track $index) {
              <option [ngValue]="clientOption">{{ clientOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_technicien" jhiTranslate="jefServiceApp.mission.technicien">Technicien</label>
          <select
            class="form-control"
            id="field_technicien"
            data-cy="technicien"
            name="technicien"
            formControlName="technicien"
            [compareWith]="compareTechnicien"
          >
            <option [ngValue]="null"></option>
            @for (technicienOption of techniciensSharedCollection; track $index) {
              <option [ngValue]="technicienOption">{{ technicienOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
